# rpmlint configuration for gitlab-ci-local
# 'yml' is not a spelling error (the pipeline file is .gitlab-ci.yml)
addFilter("spelling-error.*yml")
# Source1 is the vendored-dependencies tarball generated by
# generate-vendor-tarball.sh; it has no upstream URL by design
addFilter("invalid-url Source1")
# npm packages ship their own dotfiles (.npmignore, .editorconfig, ...)
addFilter("hidden-file-or-dir .*/node_modules/")
# npm packages ship duplicate file layouts (lib/ and dist/ trees)
addFilter("files-duplicate .*/node_modules/")
